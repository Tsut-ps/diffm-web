<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- CSP はビルド時に vite.config.ts が挿入する（開発サーバーとは両立しないため） -->
  <title>diffm</title>
  <link rel="icon" href="data:,">
  <script type="module" src="/src/app.ts"></script>
</head>
<body data-tab="diff">
  <!-- アイコン（<use> で参照する） -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-layout-auto" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/></symbol>
    <symbol id="i-layout-h" viewBox="0 0 24 24"><rect x="3" y="5" width="8" height="14" rx="1.5"/><rect x="13" y="5" width="8" height="14" rx="1.5"/></symbol>
    <symbol id="i-layout-v" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="8" rx="1.5"/><rect x="4" y="13" width="16" height="8" rx="1.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path class="f" d="M17.5 6.5v11l-8-5.5z"/><path d="M6.5 6.5v11"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path class="f" d="M6.5 6.5v11l8-5.5z"/><path d="M17.5 6.5v11"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path class="f" d="M8 5.5v13l11-6.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path class="f" d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
  </svg>

  <header>
    <div class="inner">
      <h1>diffm</h1>
      <nav class="tabs" role="tablist" aria-label="機能">
        <button type="button" role="tab" id="tab-diff" aria-controls="panel-diff" aria-selected="true">2つを比較</button>
        <button type="button" role="tab" id="tab-player" aria-controls="panel-player" aria-selected="false" tabindex="-1">複数を並べて再生</button>
      </nav>

      <!-- 開いているタブの操作（もう一方は隠れる） -->
      <div class="tools" data-for="diff">
        <span id="status" aria-live="polite"></span>
      </div>
      <div class="tools" data-for="player">
        <div class="seg" role="group" aria-label="並べ方">
          <button type="button" id="pl-layAuto" aria-pressed="true" aria-label="自動" title="画面と動画の形に合わせて自動で選ぶ">
            <svg class="ico" aria-hidden="true"><use href="#i-layout-auto"/></svg><span class="lbl">自動</span>
          </button>
          <button type="button" id="pl-layH" aria-pressed="false" aria-label="横並び" title="横に並べる">
            <svg class="ico" aria-hidden="true"><use href="#i-layout-h"/></svg><span class="lbl">横並び</span>
          </button>
          <button type="button" id="pl-layV" aria-pressed="false" aria-label="縦並び" title="縦に並べる">
            <svg class="ico" aria-hidden="true"><use href="#i-layout-v"/></svg><span class="lbl">縦並び</span>
          </button>
        </div>
        <button type="button" class="btn" id="pl-add" aria-label="動画を追加" title="動画を追加">
          <svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg><span class="lbl">動画を追加</span>
        </button>
        <input id="pl-file" type="file" accept="video/*" multiple hidden>
      </div>
    </div>
    <progress id="bar" max="1" value="0" hidden aria-label="比較の進み具合"></progress>
  </header>

  <main>
    <div class="diff" id="panel-diff" role="tabpanel" aria-labelledby="tab-diff">
      <!-- A と B の枠が、そのまま動画の受け口になる（クリック、ドロップ、ウィンドウ全体へのドロップ） -->
      <section class="views" aria-label="比較する動画とフレーム">
        <figure class="view slot" data-slot="A">
          <label class="pane" for="fileA" title="クリックして A を選ぶ・入れ替える">
            <canvas id="cA" width="16" height="9"></canvas>
            <span class="pane-hint">
              <b>A（基準）</b>
              <span id="nameA">クリックして選択、またはドロップ</span>
            </span>
          </label>
          <input class="visually-hidden" id="fileA" type="file" accept="video/*,.mkv,.webm,.mov,.mp4">
          <figcaption><span id="capA"></span><span class="meta" id="metaA"></span></figcaption>
        </figure>
        <figure class="view slot" data-slot="B">
          <label class="pane" for="fileB" title="クリックして B を選ぶ・入れ替える">
            <canvas id="cB" width="16" height="9"></canvas>
            <span class="pane-hint">
              <b>B（比較対象）</b>
              <span id="nameB">クリックして選択、またはドロップ</span>
            </span>
          </label>
          <input class="visually-hidden" id="fileB" type="file" accept="video/*,.mkv,.webm,.mov,.mp4">
          <figcaption><span id="capB"></span><span class="meta" id="metaB"></span></figcaption>
        </figure>
        <figure class="view">
          <div class="pane">
            <canvas id="cD" width="16" height="9"></canvas>
            <span class="pane-hint" id="diffHint">
              <b>差分</b>
            </span>
          </div>
          <figcaption><span id="capD"></span><span class="res" id="resD" title="比較に使う解像度（A の大きさに、比較の解像度を掛けたもの）"></span></figcaption>
        </figure>
      </section>

      <ul class="warnings" id="warnings" aria-live="polite"></ul>
      <p class="error" id="error" role="alert" hidden></p>

      <section class="options" aria-label="比較の実行と設定">
        <div class="run-buttons">
          <button class="btn primary" id="start" type="button" disabled>開始</button>
          <button class="btn" id="stop" type="button" disabled>停止</button>
        </div>
        <label class="labeled">フレームの合わせ方
          <select class="field" id="mode" title="A のどのフレームと、B のどのフレームを比べるか。フレーム番号: A の n 番目と B の n 番目 / 時刻: A の各フレームの時刻に、B で表示されているフレーム">
            <option value="auto">自動（fps が違えば時刻）</option>
            <option value="index">フレーム番号</option>
            <option value="time">時刻（秒）</option>
          </select>
        </label>
        <label class="labeled">比較の解像度
          <select class="field" id="scale" title="差分を計算するときに、縦横をこの割合に縮小する（50% なら画素数は 1/4）。小さいほど速いが、細かい差は見逃しやすい">
            <option value="1">100%（原寸・正確）</option>
            <option value="0.5">50%</option>
            <option value="0.25">25%（雑・速い）</option>
          </select>
        </label>
        <label class="labeled">途中経過の更新
          <select class="field" id="redraw" title="比較中に、差分の画像とグラフを、1秒に最大で何回描き直すか。「全フレーム」は、比較した全てのフレームを描き直す（負荷が高く、比較は遅くなる）。結果の値には影響しない">
            <option value="auto">自動</option>
            <option value="max">全フレーム（滑らか・高負荷）</option>
            <option value="30">最大 30 回/秒</option>
            <option value="10">最大 10 回/秒</option>
            <option value="5">最大 5 回/秒</option>
            <option value="1">最大 1 回/秒（軽い）</option>
          </select>
        </label>
        <label class="labeled">差分の強調
          <select class="field" id="gain">
            <option value="1">×1</option>
            <option value="4">×4</option>
            <option value="16">×16</option>
          </select>
        </label>
      </section>

      <!-- 差分グラフ。しきい値を超えた区間は、グラフ上に帯で出す -->
      <section class="graph" aria-label="差分グラフ">
        <div class="graph-head">
          <span class="graph-summary" id="rangeSummary" aria-live="polite"></span>
          <div class="range-nav" role="group" aria-label="区間の移動">
            <button type="button" class="icon" id="rangePrev" disabled title="前の区間のピークへ" aria-label="前の区間のピークへ">
              <svg class="ico" aria-hidden="true"><use href="#i-back"/></svg>
            </button>
            <button type="button" class="icon" id="rangeNext" disabled title="次の区間のピークへ" aria-label="次の区間のピークへ">
              <svg class="ico" aria-hidden="true"><use href="#i-fwd"/></svg>
            </button>
          </div>
          <label class="inline">しきい値
            <input class="field" id="threshold" data-drag="y" type="number" min="0" max="255" step="0.1" value="1" title="0〜255。この値以上が続く範囲を「区間」とする。ドラッグでも変えられる（Shift で細かく）">
          </label>
          <button class="btn" id="exportImages" type="button" disabled title="各区間のピークのフレームを、A | B | 差分 の PNG にして ZIP で保存">画像を ZIP で保存</button>
          <button class="btn" id="exportCsv" type="button" disabled title="全フレームの差分の値を保存">CSV で保存</button>
        </div>
        <canvas id="chart"></canvas>
        <div class="tip" id="tip" hidden></div>
      </section>
    </div>

    <div class="player" id="panel-player" role="tabpanel" aria-labelledby="tab-player" hidden>
      <div class="pl-wrap" id="pl-wrap">
        <div class="pl-stage" id="pl-stage" data-layout="h" role="region" aria-label="動画"></div>
        <div class="pl-cta" id="pl-cta">
          <div class="pl-cta-box">
            <h2>動画をここにドロップ</h2>
            <button type="button" class="btn primary" id="pl-pick">ファイルを選ぶ</button>
          </div>
        </div>
      </div>

      <section class="transport" aria-label="再生コントロール">
        <div class="t-play">
          <button type="button" class="icon" id="pl-back" title="1コマ戻る ( ← )" aria-label="1コマ戻る">
            <svg class="ico" aria-hidden="true"><use href="#i-back"/></svg>
          </button>
          <button type="button" class="play" id="pl-play" aria-pressed="false" aria-label="再生 / 一時停止" title="再生 / 一時停止 (Space)">
            <svg class="ico pl" aria-hidden="true"><use href="#i-play"/></svg>
            <svg class="ico pa" aria-hidden="true"><use href="#i-pause"/></svg>
          </button>
          <button type="button" class="icon" id="pl-fwd" title="1コマ進む ( → )" aria-label="1コマ進む">
            <svg class="ico" aria-hidden="true"><use href="#i-fwd"/></svg>
          </button>
        </div>
        <div class="t-time time" aria-live="off"><span id="pl-cur">0:00.00</span><span class="dim"> / </span><span id="pl-tot">0:00.00</span></div>
        <div class="t-scrub"><input class="scrub" id="pl-scrub" type="range" min="0" max="1" step="1" value="0" aria-label="再生位置"></div>
        <div class="t-opts">
          <select class="field rate" id="pl-rate" aria-label="再生速度">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
          <button type="button" class="icon tog" id="pl-loop" aria-pressed="false" title="ループ再生" aria-label="ループ再生">
            <svg class="ico" aria-hidden="true"><use href="#i-loop"/></svg>
          </button>
          <button type="button" class="icon mute" id="pl-muteAll" aria-pressed="false" title="すべてミュート (M)" aria-label="すべてミュート">
            <svg class="ico on" aria-hidden="true"><use href="#i-volume"/></svg>
            <svg class="ico off" aria-hidden="true"><use href="#i-muted"/></svg>
          </button>
        </div>
      </section>

      <div class="veil" id="pl-veil" hidden><div>離すと追加します</div></div>
      <div class="pl-toast" id="pl-toast" role="status" aria-live="polite" hidden></div>

      <template id="pl-tile">
        <figure class="tile">
         <div class="tile-in">
          <figcaption class="cap">
            <span class="name"></span>
            <label class="shift" title="この動画を始めるタイミング（秒）。プラスで遅らせ、マイナスで先へ進めます。ドラッグでも変えられる（Shift で細かく）">
              <span>開始オフセット</span><input class="field" data-drag-curve="linear" type="number" step="0.01" value="0.00" inputmode="decimal"><span>秒</span>
            </label>
            <button type="button" class="icon mute" aria-pressed="false" title="この動画のミュート">
              <svg class="ico on" aria-hidden="true"><use href="#i-volume"/></svg>
              <svg class="ico off" aria-hidden="true"><use href="#i-muted"/></svg>
            </button>
            <button type="button" class="icon rm" title="この動画を外す" aria-label="この動画を外す">
              <svg class="ico" aria-hidden="true"><use href="#i-close"/></svg>
            </button>
          </figcaption>
          <video playsinline preload="auto"></video>
         </div>
        </figure>
      </template>
    </div>
  </main>

  <footer>
    <p>
      動画は送信されません（処理はすべてブラウザ内）
      · <a href="https://github.com/Tsut-ps/diffm-web" rel="noopener noreferrer">ソースコード</a>
      <!-- mediabunny を使うのは比較だけ。並べて再生は <video> なので、比較タブのときだけ出す -->
      <span class="only-diff">· 動画の読み込みに <a href="https://github.com/Vanilagy/mediabunny/tree/f630141a4ac2936d00af14bf8ff2c5bb62b66150" rel="noopener noreferrer">mediabunny 1.62.1</a>（<a href="https://mozilla.org/MPL/2.0/" rel="noopener noreferrer">MPL-2.0</a>）を使用</span>
    </p>
  </footer>

  <noscript><p>このツールには JavaScript が必要です。</p></noscript>
</body>
</html>
